name: Python library

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  distribution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tools
        run: python -m pip install "setuptools>=68" wheel
      - name: Build and install without runtime dependencies or profiles
        run: python -m unittest discover -s tests -p test_distribution.py -v

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install library
        run: python -m pip install ".[profiling]"
      # Every suite is declared once, in tools/run_tests.py. The same command is
      # documented for humans in docs/REPRODUCTION.md, so the two cannot drift.
      - name: Regression suites
        run: python tools/run_tests.py --keep-going
