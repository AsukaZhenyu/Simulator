name: Python library

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  distribution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tools
        run: python -m pip install "setuptools>=68" wheel
      - name: Build and install without runtime dependencies or profiles
        run: python -m unittest discover -s tests -p test_distribution.py -v

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install library
        run: python -m pip install ".[profiling]"
      - name: Public library tests
        run: python -m unittest discover -s tests -p test_library.py -v
      - name: Analytical input tests
        run: python -m unittest discover -s tests -p test_analytical_inputs.py -v
      - name: Independent strategy references
        run: python -m unittest discover -s tests -p test_strategy_fidelity.py -v
      - name: Policy dead-end diagnostics
        run: python -m unittest discover -s tests -p test_policy_no_progress.py -v
      - name: Analytical exploration protocol
        run: python -m unittest discover -s tests -p test_hardware_sensitivity.py -v
      - name: Measured replay contracts without hardware
        run: python -m unittest discover -s profiling/execution_calibration/tests -v
      - name: Batch sample units and profile-only freezing
        run: python -m unittest discover -s profiling/batched_calibration/tests -v
      - name: Profile-only composition model and exact IR accounting
        run: python -m unittest discover -s profiling/composition_calibration/tests -v
      - name: Common accuracy gates and explicit fork-join timing
        run: python -m unittest discover -s profiling/accuracy_suite/tests -v
      - name: Real chain profiling contracts without hardware
        run: python -m unittest discover -s profiling/chain_calibration/tests -v
      - name: Profiling, execution bridge and strict F32 provenance contracts without hardware
        run: python -m unittest discover -s profiling/tests -v
      - name: Multi-round workload and memory accuracy contracts
        run: python -m unittest discover -s profiling/workload_accuracy/tests -v
      - name: Copy-compute overlap and shared-link contracts without hardware
        run: python -m unittest discover -s profiling/overlap_accuracy/tests -v
      - name: Native batch source generation without CUDA
        run: python -m unittest discover -s profiling/native/execution_transforms_batch -p 'test_*.py' -v
      - name: State-aligned telemetry, frozen costs and runtime integration without hardware
        run: python -m unittest discover -s profiling/state_calibration/tests -v
      - name: State probe source and execution-boundary provenance without CUDA
        run: python -m unittest discover -s profiling/native/state_calibration -p 'test_*.py' -v
      - name: Unified resource functional and phased collection without hardware
        run: python -m unittest discover -s profiling/resource_calibration/tests -v
      - name: Profiling parameter evidence and modeling calibration boundaries
        run: python -m unittest discover -s profiling/parameter_calibration/tests -v
      - name: Single-layer source-bound calibration contracts without hardware
        env:
          PYTHONPATH: profiling
        run: python -m unittest discover -s profiling/single_layer_calibration/tests -v
      - name: Same-process paired diagnostic contracts without hardware
        env:
          PYTHONPATH: profiling
        run: python -m unittest discover -s profiling/single_layer_context_pair/tests -v
      - name: CUDA API and GPU interval attribution without hardware
        env:
          PYTHONPATH: profiling
        run: python -m unittest discover -s profiling/single_layer_wait_diagnosis/tests -v
      - name: Single-layer native source and provenance guards without CUDA
        run: python -m unittest discover -s profiling/native/single_layer_calibration -p 'test_build.py' -v
      - name: Paired native source and provenance guards without CUDA
        run: python -m unittest discover -s profiling/native/single_layer_context_pair -p 'test_build.py' -v
      - name: NVTX diagnostic source and provenance guards without CUDA
        run: python -m unittest discover -s profiling/native/single_layer_wait_diagnosis -p 'test_build.py' -v
      - name: Installed performance ownership boundaries
        run: python -m unittest discover -s tests -p test_performance_boundaries.py -v
      - name: Portable calibration report integrity without hardware
        run: python -m unittest discover -s tools/tests -v
      - name: Modeling tests
        run: python -m unittest discover -s modeling/tests -v
      - name: Mapping tests
        run: python -m unittest discover -s mapping/tests -t mapping -v
