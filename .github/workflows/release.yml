name: Build downloadable alpha release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install "setuptools>=68" wheel
      - name: Check installation outside the checkout
        run: python -m unittest discover -s tests -p test_distribution.py -v
      - name: Install and test public APIs
        run: |
          python -m pip install --no-build-isolation .
          python -m unittest discover -s tests -p test_library.py -v
          python -m unittest discover -s tests -p test_analytical_inputs.py -v
      - name: Build distributions
        run: python -c "from setuptools.build_meta import build_sdist, build_wheel; build_sdist('dist'); build_wheel('dist')"
      - name: Publish versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes-file docs/RELEASE_0_1.md --prerelease --verify-tag
