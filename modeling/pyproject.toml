[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-infer-model"
version = "0.1.0"
description = "Analytical and discrete-event models for resource-constrained LLM inference"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gguf = ["numpy>=1.26", "PyYAML>=6.0"]

[project.scripts]
llm-infer-model = "llm_infer_model.cli:main"

[tool.setuptools]
packages = ["llm_infer_model"]
